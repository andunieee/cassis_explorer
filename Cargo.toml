[package]
name = "cassis-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.3", features = ["csr"] }
console_error_panic_hook = "0.1.7"
cassis-core = { git = "https://github.com/andunieee/cassis", rev = "8eab69152f19c8709c7e153059863a4be4c95a41", default-features = false }
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Element", "Storage"] }
